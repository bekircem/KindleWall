name: Bug report
description: Something behaves differently from what the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fields below are the ones that usually decide
        whether a bug can be reproduced — without them most reports stall.
  - type: input
    id: app-version
    attributes:
      label: KindleWall version
      description: KindleWall → About, or `brew info --cask kindlewall`.
      placeholder: "1.1.2"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: "26.1 (Tahoe), Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Homebrew cask
        - DMG from Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: clipping
    attributes:
      label: The clipping involved, if the bug is about one
      description: |
        Parsing bugs almost always come down to one specific entry in `My Clippings.txt`.
        Paste the entry between the `==========` separators. Redact anything you would
        rather not publish — the shape of the entry matters more than its words.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have checked that this report does not contain anything I want to keep private.
          required: true
