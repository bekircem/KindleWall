name: KindleWall
options:
  bundleIdPrefix: com.kindlewall
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: false
    # Self-signed cert: TCC tracks permission by cert identity, not binary hash.
    # Create "KindleWall Dev" cert once in Keychain Access → Certificate Assistant
    # → Create a Certificate → Code Signing → Self-Signed Root.
    CODE_SIGN_IDENTITY: "KindleWall Dev"
    CODE_SIGNING_REQUIRED: "NO"
    # Fixed output path so .app location never changes between builds.
    SYMROOT: $(PROJECT_DIR)/.build

targets:
  KindleWall:
    type: application
    platform: macOS
    sources:
      - path: KindleWall
        excludes:
          - "Resources/Info.plist"
          - "Resources/KindleWall.entitlements"
    info:
      path: KindleWall/Resources/Info.plist
      properties:
        NSAccessibilityUsageDescription: "Herhangi bir uygulamada seçtiğin metni KindleWall'a alıntı olarak eklemek için kullanılır."
        NSServices:
          - NSMenuItem:
              default: "KindleWall'a Alıntı Ekle"
            NSMessage: addClippingFromService
            NSSendTypes:
              - NSStringPboardType
    entitlements:
      path: KindleWall/Resources/KindleWall.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlewall.app
        INFOPLIST_FILE: KindleWall/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KindleWall/Resources/KindleWall.entitlements
        PRODUCT_NAME: KindleWall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: UserNotifications.framework
