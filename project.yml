name: KindleWall
options:
  bundleIdPrefix: com.kindlewall
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    # Swift 6 language mode: isolation violations are errors, not warnings, so the
    # concurrency work done to get here cannot quietly regress. Reached in two steps —
    # SWIFT_STRICT_CONCURRENCY under 5.9 first, to see the whole inventory as warnings
    # before anything had to compile.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CB9V39VP62
    # Fixed output path so .app location never changes between builds.
    SYMROOT: $(PROJECT_DIR)/.build
    # Xcode 15+ recommended setting — opt out of user script sandboxing
    # (this app has no Run Script build phases, so the value is academic;
    #  setting it explicitly silences the "Update to recommended settings" warning).
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      # Everyday development: the local device profile, no runtime restrictions.
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      # What ships. Notarization refuses anything without the hardened runtime.
      #
      # Deliberately NO CODE_SIGN_IDENTITY here. Pinning "Developer ID Application" while
      # CODE_SIGN_STYLE stays Automatic makes the archive fail outright with "conflicting
      # provisioning settings" — automatic signing insists on choosing the identity itself.
      # The Developer ID signature is applied where it belongs: `xcodebuild -exportArchive`
      # with `method: developer-id` re-signs the archive and pulls the matching profile,
      # which is also how Xcode's own Organizer does it.
      ENABLE_HARDENED_RUNTIME: "YES"

targets:
  KindleWall:
    type: application
    platform: macOS
    sources:
      - path: KindleWall
        excludes:
          - "Resources/Info.plist"
          - "Resources/KindleWall.entitlements"
          - "Resources/KindleWall.Release.entitlements"
    # No `info:` block on purpose. XcodeGen *generates* Info.plist when one is present, which
    # means every `xcodegen generate` overwrites the file — and with it the version the release
    # script just stamped, silently resetting it to 1.0/1. The plist is hand-maintained instead
    # and wired up through INFOPLIST_FILE below; `release.sh` writes it and nothing overwrites
    # it afterwards.
    # No `entitlements:` block either, for the same reason as the plist: XcodeGen would
    # regenerate the file and undo the hand-written keys. Both entitlement files are
    # maintained by hand and selected per configuration below.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlewall.app
        INFOPLIST_FILE: KindleWall/Resources/Info.plist
        PRODUCT_NAME: KindleWall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this the asset-catalog AccentColor is never adopted and every
        # `Color.accentColor` in the app silently falls back to the system blue —
        # which is what shipped, despite the warm amber sitting in Assets unused.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: KindleWall/Resources/KindleWall.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: KindleWall/Resources/KindleWall.Release.entitlements
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: CloudKit.framework
    scheme:
      testTargets:
        - KindleWallTests

  KindleWallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KindleWallTests
    dependencies:
      - target: KindleWall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlewall.app.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KindleWall.app/Contents/MacOS/KindleWall
